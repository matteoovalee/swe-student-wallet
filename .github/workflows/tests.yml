name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          if [ -f 05-Final/prototype/requirements.txt ]; then
            pip install -r 05-Final/prototype/requirements.txt
          fi
          pip install pytest
      - name: Run tests
        working-directory: 05-Final/prototype
        run: |
          # exit code 5 means "no tests collected yet": allowed until the first tests exist
          pytest || [ $? -eq 5 ]
